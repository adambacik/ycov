[project]
name = "ycov"
version = "0.1.0"
description = "Visualise and compare Y chromosome coverage across many samples"
readme = "README.md"
authors = [
    { name = "adambacik" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ycov = "ycov:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
scripts = [
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
]

[tool.mypy]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "plotly.*"
]
ignore_missing_imports = true
